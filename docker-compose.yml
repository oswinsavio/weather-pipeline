services:
  # Final Serving Database: PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: weather_postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weather_user -d weather_serving"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_data: